# Mortgage Tool Kit API — Cloudflare Worker (prod = default env, dev = [env.dev]).
# Provides the auth backend (login/logout/session/change-password) for the
# static Pages frontend. custom_domain=true makes `wrangler deploy` create the
# DNS record + edge cert for the worker's hostname.

name = "mtk-api"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# ---------------- PROD (default) ----------------
routes = [
  { pattern = "mtk-api.dabrewer.dev", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://mtk.dabrewer.dev"

[[d1_databases]]
binding = "DB"
database_name = "mtk-prod"
database_id = "aad58827-b1a7-42e9-b8f7-ca00fea4dfed"

# ---------------- DEV ----------------
[env.dev]
name = "mtk-api-dev"
routes = [
  { pattern = "mtk-api-dev.dabrewer.dev", custom_domain = true }
]

[env.dev.vars]
ALLOWED_ORIGIN = "https://mtk.dabrewer.dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mtk-dev"
database_id = "6595bfd2-3f82-44e0-9090-8825a1e1b783"
