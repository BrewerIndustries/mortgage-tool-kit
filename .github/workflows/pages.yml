name: Deploy to GitHub Pages

# Publishes BOTH versions to one Pages site:
#   main -> /        (prod)   https://mtk.dabrewer.dev/
#   dev  -> /dev/    (dev)    https://mtk.dabrewer.dev/dev/
# Lives on the dev branch only; it checks out both branches itself. Pushing to
# main does not auto-redeploy — re-run via "Run workflow" or push to dev.

on:
  push:
    branches: [dev]
  schedule:
    - cron: "20 12 * * 1"   # weekly, Mondays 12:20 UTC — refresh bundled Treasury rates
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (prod) into site root
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site
      - name: Checkout dev into /dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: _site/dev
      - name: Strip git/CI dirs, backend source, and set custom domain
        run: |
          rm -rf _site/.git _site/.github _site/api _site/dev/.git _site/dev/.github _site/dev/api
          echo "mtk.dabrewer.dev" > _site/CNAME
      # Fetch the latest Treasury rates and bake them into both the prod root and /dev/.
      # Best-effort: if FRED is unreachable, the committed tnote-rates.js (checked out
      # above) is served instead, so a bad fetch can never take the site down.
      - name: Refresh Treasury rate data
        continue-on-error: true
        run: |
          bash _site/dev/scripts/fetch-tnote-rates.sh
          cp _site/dev/tnote-rates.js _site/tnote-rates.js
          echo "prod root data head:"; head -c 140 _site/tnote-rates.js; echo
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
